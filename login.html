<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Biografia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Biografia</a>
            <a href="login.html">Entrar / Cadastrar</a>
        </nav>
    </header>

    <main>
        <div class="bio-container">
            <h2 id="formTitle">Acesse o Sistema</h2> 
            
            <form id="loginForm">
                <label for="username">Usuário:</label>
                <input type="text" id="username" required>
                
                <label for="password">Senha:</label>
                <input type="password" id="password" required>
                
                <button type="submit" id="submitBtn">Entrar</button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <span id="toggleText">Não tem uma conta?</span>
                <a href="#" id="toggleLink" style="color: #00adb5; font-weight: bold; text-decoration: none;"> Cadastre-se</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
